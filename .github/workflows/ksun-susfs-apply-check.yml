name: KSUN SUSFS Patch Apply Check
on:
  workflow_dispatch:
    inputs:
      KERNEL_SUBLEVEL:
        description: "Kernel Sublevel (lts atau angka; SUSFS 6.1.167 ke atas)"
        type: string
        default: "lts"
      BBG:
        description: "BBG"
        type: boolean
        default: true
      NETWORKING:
        description: "Networking"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  apply-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve current kernel pin
        id: source
        env:
          SUBLEVEL_INPUT: ${{ inputs.KERNEL_SUBLEVEL }}
        run: |
          set -euo pipefail
          sublevel="$(python3 scripts/ksun_susfs_sublevel.py resolve "$SUBLEVEL_INPUT")"
          commit="$(python3 scripts/ksun_susfs_sublevel.py commit "$sublevel")"
          echo "sublevel=$sublevel" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Fetch selected kernel and check production patch series
        env:
          KERNEL_COMMIT: ${{ steps.source.outputs.commit }}
          SUBLEVEL: ${{ steps.source.outputs.sublevel }}
          BBG: ${{ inputs.BBG }}
          NETWORKING: ${{ inputs.NETWORKING }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ksun-susfs/kernel"
          kernel="$RUNNER_TEMP/ksun-susfs/kernel"
          git -C "$kernel" init -q
          git -C "$kernel" fetch -q --depth=1 https://github.com/ahmed-alnassif/GKI-Duchamp-6.1.git "$KERNEL_COMMIT"
          git -C "$kernel" checkout -q --detach FETCH_HEAD
          python3 scripts/stage_ksun_susfs_candidate.py "$kernel" "$RUNNER_TEMP/ksun-susfs/ksun" "$SUBLEVEL"
          {
            echo '## KSUN + SUSFS — Patch Apply Check'
            echo "Kernel: 6.1.$SUBLEVEL ($KERNEL_COMMIT); BBG=$BBG; Networking=$NETWORKING"
            echo 'Patch berhasil diterapkan pada source terpilih. Kompilasi dan uji perangkat belum dijalankan.'
            echo 'Patches applied to the selected source. Compilation and device testing have not run.'
          } >> "$GITHUB_STEP_SUMMARY"
