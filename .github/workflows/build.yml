name: GKID Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      TODO:
        description: To do
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      TEST:
        description: debug the pipeline
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      LTO:
        description: enable LTO optimization
        default: "fullLTO"
        type: choice
        options:
          - "noneLTO"
          - "thinLTO"
          - "fullLTO"

      KERNEL_VERSION:
        description: "GKI LTS kernel line to build"
        default: "All"
        type: choice
        options:
          - "All"
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

      KERNEL_SOURCE_REF:
        description: "Optional GKID source branch/tag for requested sublevel (blank = existing default)"
        type: string
        default: ""

      KERNEL_SUBLEVEL:
        description: "Kernel 6.1 sublevel: Auto or 161–177 (requires matching source ref)"
        type: choice
        default: "Auto"
        options:
          - "Auto"
          - "161"
          - "162"
          - "163"
          - "164"
          - "165"
          - "166"
          - "167"
          - "168"
          - "169"
          - "170"
          - "171"
          - "172"
          - "173"
          - "174"
          - "175"
          - "176"
          - "177"

      BUILD_FLAVORS:
        description: "Comma-separated: vanilla,ksu,ksun,susfs (default all)"
        type: string
        default: "vanilla,ksu,ksun,susfs"

      BUILD_TIME:
        description: "Build timestamp: N = current UTC; or Sat Oct 10 19:10:00 UTC 2026"
        type: string
        default: "N"

      DROIDSPACES:
        description: "Enable droidspaces-oss support (optional)"
        type: boolean
        default: false

      EXTRA_FEATURES:
        description: "Options: nomount,clean-lto-cache (comma-separated; blank = none)"
        type: string
        default: "nomount,clean-lto-cache"

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  ensure-cache-release:
    name: Ensure ccache release exists
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create persistent cache release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ci-ccache-store --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ci-ccache-store already exists"
          else
            echo "Creating ci-ccache-store release"
            gh release create ci-ccache-store \
              --repo "${{ github.repository }}" \
              --title "CI ccache store (internal - do not delete)" \
              --notes "Persistent compiler cache used by the build workflow. Each build matrix entry keeps one asset here (ccache-<variant>.tar.zst). Safe to delete if you want to force a cold cache for everything; the workflow recreates this release and rebuilds the caches automatically, just slower for the next run per variant." \
              --prerelease \
              --latest=false
          fi

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Validate requested kernel sublevel
        env:
          SELECTED_KERNEL_VERSION: ${{ inputs.KERNEL_VERSION }}
          SELECTED_KERNEL_SUBLEVEL: ${{ inputs.KERNEL_SUBLEVEL }}
          SELECTED_KERNEL_SOURCE_REF: ${{ inputs.KERNEL_SOURCE_REF }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_KERNEL_SUBLEVEL" != "Auto" && -n "$SELECTED_KERNEL_SUBLEVEL" ]]; then
            if [[ "$SELECTED_KERNEL_VERSION" != "6.1" ]]; then
              echo "::error::Select KERNEL_VERSION=6.1 when choosing a specific sublevel."
              exit 1
            fi
            if [[ ! "$SELECTED_KERNEL_SUBLEVEL" =~ ^(16[1-9]|17[0-7])$ ]]; then
              echo "::error::Kernel 6.1 sublevel must be between 161 and 177."
              exit 1
            fi
          fi
          if [[ "$SELECTED_KERNEL_SUBLEVEL" != "Auto" && "$SELECTED_KERNEL_SUBLEVEL" != "177" && -z "$SELECTED_KERNEL_SOURCE_REF" ]]; then
            echo "::error::The current default GKID 6.1 branches identify as 6.1.177. For sublevel $SELECTED_KERNEL_SUBLEVEL, provide a verified matching KERNEL_SOURCE_REF to avoid a wasted build."
            exit 1
          fi
          if [[ -n "$SELECTED_KERNEL_SOURCE_REF" ]]; then
            if [[ ! "$SELECTED_KERNEL_SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ || "$SELECTED_KERNEL_SOURCE_REF" == -* || "$SELECTED_KERNEL_SOURCE_REF" == *..* ]]; then
              echo "::error::Invalid KERNEL_SOURCE_REF; use a branch or tag name."
              exit 1
            fi
          fi
          if [[ -n "$SELECTED_KERNEL_SOURCE_REF" && "$SELECTED_KERNEL_VERSION" != "6.1" ]]; then
            echo "::error::Select KERNEL_VERSION=6.1 when overriding GKID source ref."
            exit 1
          fi

      - name: Validate extra feature selection
        env:
          EXTRA_FEATURES: ${{ inputs.EXTRA_FEATURES }}
        run: |
          set -euo pipefail
          IFS=',' read -ra features <<< "$EXTRA_FEATURES"
          declare -A seen=()
          for feature in "${features[@]}"; do
            if [[ "$feature" =~ [[:space:]] ]]; then
              echo "::error::EXTRA_FEATURES must not contain whitespace."
              exit 1
            fi
            if [[ "$feature" != "nomount" && "$feature" != "clean-lto-cache" ]]; then
              echo "::error::EXTRA_FEATURES supports only nomount,clean-lto-cache."
              exit 1
            fi
            if [[ -n "${seen[$feature]:-}" ]]; then
              echo "::error::Duplicate EXTRA_FEATURES entry: $feature"
              exit 1
            fi
            seen[$feature]=1
          done

      - name: Validate build time
        env:
          BUILD_TIME: ${{ inputs.BUILD_TIME }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_TIME" != "N" ]]; then
            if [[ ! "$BUILD_TIME" =~ ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[[:space:]](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[[:space:]][0-9]{1,2}[[:space:]][0-9]{2}:[0-9]{2}:[0-9]{2}[[:space:]]UTC[[:space:]][0-9]{4}$ ]]; then
              echo "::error::BUILD_TIME must be N or e.g. Sat Oct 10 19:10:00 UTC 2026."
              exit 1
            fi
            date -u -d "$BUILD_TIME" >/dev/null || { echo "::error::Invalid BUILD_TIME date."; exit 1; }
            actual_day="$(LC_ALL=C date -u -d "$BUILD_TIME" +%a)"
            requested_day="${BUILD_TIME%% *}"
            if [[ "$actual_day" != "$requested_day" ]]; then
              echo "::error::BUILD_TIME weekday does not match the calendar date (expected $actual_day)."
              exit 1
            fi
          fi

      - name: Generate build matrix
        id: set-matrix
        env:
          KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
          BUILD_FLAVORS: ${{ inputs.BUILD_FLAVORS }}
        run: |
          python3 py/generate-matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, ensure-cache-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio
          pip install lxml

      - name: Restore ccache from release
        id: restore-ccache
        uses: ./.github/actions/ccache-restore
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REPO: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KERNEL_SUBLEVEL: ${{ inputs.KERNEL_SUBLEVEL }}
          KERNEL_SOURCE_REF: ${{ inputs.KERNEL_SOURCE_REF }}
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          TODO: ${{ inputs.TODO }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          CLEAN_LTO_CACHE: ${{ contains(format(',{0},', inputs.EXTRA_FEATURES), ',clean-lto-cache,') }}
          BUILD_TIME: ${{ inputs.BUILD_TIME }}
          DROIDSPACES: ${{ inputs.DROIDSPACES }}
          NM: ${{ contains(format(',{0},', inputs.EXTRA_FEATURES), ',nomount,') }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save ccache to release
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          VARIANT=${{ env.VARIANT }}
          KSU=${{ matrix.KSU }}
          KSU_COMPAT=${{ matrix.KSU_COMPAT }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

          if find . -name "*.rej" -type f | grep -q .; then
          mkdir -p rejected-patches-${{ matrix.name }}
          find . -name "*.rej" -type f -exec sh -c 'cp "$1" "rejected-patches-${{ matrix.name }}/$(echo "$1" | sed "s|^\./||; s|/|_|g")"' _ {} \;
          echo "Found $(find rejected-patches-${{ matrix.name }} -type f | wc -l) rejected patch files"
          else
            echo "No rejected patches found for ${{ matrix.name }}"
          fi

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build-env-${{ matrix.name }}.txt
            rejected-patches-${{ matrix.name }}/
          retention-days: 1

      - name: Send rejected patches to Telegram
        if: always()
        run: |
          if [ -d "rejected-patches-${{ matrix.name }}" ] && [ "$(find rejected-patches-${{ matrix.name }} -type f | wc -l)" -gt 0 ]; then
            for file in rejected-patches-${{ matrix.name }}/*; do
              if [ -f "$file" ]; then
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.rej_BOT_TOKEN }}/sendDocument" \
                  -F chat_id="${{ secrets.rej_CHAT_ID }}" \
                  -F document=@"$file" \
                  -F caption="Rejected patch: $(basename "$file") - ${{ matrix.name }}"
                sleep 1
              fi
            done
          else
            echo "No rejected patches to send"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/*.txt
            downloaded-artifacts/*.zip

  release:
    needs: build
    if: success() && inputs.TODO == 'kernel' && inputs.TEST == 'no'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip > checksums.txt
          md5sum *.zip > checksums-md5.txt

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: ${{ inputs.TEST }}
          DROIDSPACES_INPUT: ${{ inputs.DROIDSPACES }}
          NM_INPUT: ${{ contains(format(',{0},', inputs.EXTRA_FEATURES), ',nomount,') }}
          LTO_INPUT: ${{ inputs.LTO }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          prerelease: true
          files: |
            release-artifacts/*.zip
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md

      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE }}
          MULTI_KERNEL: ${{ env.MULTI_KERNEL }}
          KERNEL_VERSIONS: ${{ env.KERNEL_VERSIONS }}
          KERNEL_VERSION: ${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE: ${{ env.ANDROID_RELEASE }}
        run: |
          set -euo pipefail

          if [[ -z "$BOT_TOKEN" || -z "$CHAT_ID" || -z "$TOPIC_ID" ]]; then
            echo "::notice::Telegram notification skipped: optional bot/chat/topic secrets are incomplete"
            exit 0
          fi

          # MULTI_KERNEL/KERNEL_VERSIONS/KERNEL_VERSION/ANDROID_RELEASE come
          # from prepare_release.py's export_github_env(). ANDROID_RELEASE
          # is only set when a single line was built.
          RELEASE_NAME=$(python3 .github/scripts/markdown_to_telegram.py --escape "$RELEASE_NAME")

          read_or_default() {
          if [[ -f "$1" ]]; then
              python3 .github/scripts/markdown_to_telegram.py "$1"
            else
              echo "Not available"
            fi
          }

          if [[ "$MULTI_KERNEL" == "true" ]]; then
            # Several GKI lines were built in this run; a full per-line
            # changelog dump doesn't fit a Telegram message, so point to
            # the GitHub release notes instead.
            LINES_ESCAPED=$(printf '%s' "$KERNEL_VERSIONS" | sed -e 's/\./\\./g' -e 's/,/, /g')

            CAPTION=$(cat <<EOF
          **$RELEASE_NAME**

          **GKI lines built:** $LINES_ESCAPED

          Full per\-line changelogs and downloads are on the release page\.

          [**Download**]($RELEASE_URL)

          [Commit]($COMMIT_URL) • [CI \#$RUN_NUMBER]($RUN_URL)
          EOF
            )
          else
            KERNEL_VERSION="${KERNEL_VERSION:-6.1}"
            ANDROID_RELEASE="${ANDROID_RELEASE:-14}"

            # MarkdownV2-escape the "AndroidNN-K.V-LTS" label and bare kernel
            # version for use inside the heredocs below.
            KERNEL_LABEL_ESCAPED=$(printf '%s' "Android${ANDROID_RELEASE}-${KERNEL_VERSION}-LTS" | sed -e 's/\./\\./g' -e 's/-/\\-/g')
            KERNEL_VERSION_ESCAPED=$(printf '%s' "$KERNEL_VERSION" | sed 's/\./\\./g')

            CHANGELOG_BODY=$(cat <<INNER
          What's new:
          **${KERNEL_LABEL_ESCAPED}:**
          $(read_or_default "release-artifacts/android_kernel-${KERNEL_VERSION}_changelog.txt")

          \-\-\-
          **SuSFS:**
          $(read_or_default "release-artifacts/susfs_changelog-${KERNEL_VERSION}.txt")

          \-\-\-
          **NoMount:**
          $(read_or_default "release-artifacts/nomount_changelog.txt")

          \-\-\-
          **KernelSU:**
          $(read_or_default "release-artifacts/ksu_changelog.txt")

          \-\-\-
          **ReSukiSU:**
          $(read_or_default "release-artifacts/ReSukiSU_changelog.txt")

          \-\-\-
          **KernelSU Next:**
          $(read_or_default "release-artifacts/ksun_changelog.txt")
          INNER
            )

            CHANGELOG_QUOTED=$(printf '%s\n' "$CHANGELOG_BODY" | sed 's/^[[:space:]]*//' | awk '
              NR==1 { print "**>" $0; next }
              { lines[NR] = $0 }
              END {
                for (i = 2; i <= NR; i++) {
                  if (i == NR) print ">" lines[i] "||"
                  else print ">" lines[i]
                }
              }
            ')

            CAPTION=$(cat <<EOF
          **$RELEASE_NAME**

          **Supported devices:**
          All devices that shipped with **Linux ${KERNEL_VERSION_ESCAPED}\.x** and **Android ${ANDROID_RELEASE}** \(stock or AOSP\)

          $CHANGELOG_QUOTED

          [**Download**]($RELEASE_URL)

          [Commit]($COMMIT_URL) • [CI \#$RUN_NUMBER]($RUN_URL)
          EOF
            )
          fi

          CAPTION=$(printf '%s\n' "$CAPTION" | sed 's/^[[:space:]]*//')

          curl --fail-with-body -sS \
            -F "chat_id=$CHAT_ID" \
            -F "message_thread_id=$TOPIC_ID" \
            -F "photo=@docs/banner.png" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendPhoto"

          curl --fail-with-body -sS \
            -F "chat_id=$CHAT_ID" \
            -F "message_thread_id=$TOPIC_ID" \
            -F "text=$CAPTION" \
            -F "parse_mode=MarkdownV2" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
